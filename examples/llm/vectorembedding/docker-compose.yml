# Run just this module's pair:
#   cd examples/llm/vectorembedding && docker compose up --build
#
# Vulnerable: http://localhost:8043   Secure: http://localhost:8044
services:
  vulnerable:
    build: ./vulnerable
    ports:
      - "8043:8000"
  secure:
    build: ./secure
    ports:
      - "8044:8000"
