# Run just this module's pair:
#   cd examples/llm/outputhandling && docker compose up --build
#
# Vulnerable: http://localhost:8037   Secure: http://localhost:8038
services:
  vulnerable:
    build: ./vulnerable
    ports:
      - "8037:8000"
  secure:
    build: ./secure
    ports:
      - "8038:8000"
