# Run just this module's pair:
#   cd examples/web/loggingfailures && docker compose up --build
#
# Vulnerable: http://localhost:8027   Secure: http://localhost:8028
services:
  vulnerable:
    build: ./vulnerable
    ports:
      - "8027:8000"
  secure:
    build: ./secure
    ports:
      - "8028:8000"
