# Run just this module's pair:
#   cd examples/web/pathtraversal && docker compose up --build
#
# Vulnerable: http://localhost:8009   Secure: http://localhost:8010
services:
  vulnerable:
    build: ./vulnerable
    ports:
      - "8009:8000"
  secure:
    build: ./secure
    ports:
      - "8010:8000"
