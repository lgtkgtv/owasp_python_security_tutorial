# Run just this module's pair:
#   cd examples/web/sensitivedata && docker compose up --build
#
# Vulnerable: http://localhost:8021   Secure: http://localhost:8022
services:
  vulnerable:
    build: ./vulnerable
    ports:
      - "8021:8000"
  secure:
    build: ./secure
    ports:
      - "8022:8000"
