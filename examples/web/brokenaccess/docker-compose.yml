# Run just this module's pair:
#   cd examples/web/brokenaccess && docker compose up --build
#
# Vulnerable: http://localhost:8023   Secure: http://localhost:8024
services:
  vulnerable:
    build: ./vulnerable
    ports:
      - "8023:8000"
  secure:
    build: ./secure
    ports:
      - "8024:8000"
